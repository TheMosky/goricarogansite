name: Instagram sync

on:
  workflow_dispatch: {}
  schedule:
    - cron: '23 */12 * * *'   # svakih 12h

permissions:
  contents: write

concurrency:
  group: instagram-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync Instagram media
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: bash .github/scripts/sync-instagram.sh

      - name: Commit & push if changed
        run: |
          git config user.name "instagram-sync"
          git config user.email "actions@users.noreply.github.com"
          git add assets/instagram.json assets/img/instagram 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Nema promena u feedu."
          else
            git commit -m "chore: sync Instagram feed [skip ci]"
            git push
          fi
