<!doctype html>
<html lang="sr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Instagram povezivanje — Poliklinika Pekić</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{min-height:100vh;display:grid;place-items:center;padding:1.5rem;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:#ece4d7;color:#1b1216}
  .card{max-width:520px;width:100%;background:#f6efe6;border:1px solid #e2d5c5;
    border-radius:18px;padding:clamp(1.5rem,5vw,2.6rem);
    box-shadow:0 30px 60px -30px rgba(27,18,22,.35);text-align:center}
  .badge{width:56px;height:56px;border-radius:50%;background:#be6e52;color:#fff;
    display:grid;place-items:center;margin:0 auto 1.1rem;font-size:1.7rem;font-weight:700}
  h1{font-family:Georgia,"Times New Roman",serif;font-weight:600;
    font-size:clamp(1.4rem,4vw,1.9rem);margin-bottom:.6rem;letter-spacing:-.01em}
  p{color:#5b4f5a;line-height:1.55;font-size:.98rem}
  .code{margin:1.3rem 0 .5rem;background:#1b1216;color:#e7d2a8;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.82rem;
    word-break:break-all;padding:1rem 1.1rem;border-radius:12px;line-height:1.5;
    text-align:left;max-height:150px;overflow:auto}
  button{margin-top:.4rem;background:#3a1e30;color:#f6efe6;border:0;cursor:pointer;
    font-size:.95rem;padding:.85rem 1.6rem;border-radius:40px;transition:opacity .2s}
  button:hover{opacity:.88}
  .hint{margin-top:1rem;font-size:.82rem;color:#8a7d86}
  .err{color:#a1543a;font-weight:600}
  .copied{color:#4b7a52;font-size:.8rem;margin-top:.5rem;min-height:1rem}
</style>
</head>
<body>
  <div class="card">
    <div class="badge" id="badge">✓</div>
    <h1 id="title">Instagram povezan</h1>
    <p id="lead">Hvala! Nalog je uspešno autorizovan. Pošaljite ovaj kôd osobi koja održava sajt:</p>
    <div class="code" id="code">…</div>
    <button id="copyBtn" type="button">Kopiraj kôd</button>
    <div class="copied" id="copied"></div>
    <p class="hint">Kôd važi kratko — najbolje ga odmah proslediti. Ovo daje pristup samo javnim objavama; lozinka se nigde ne deli.</p>
  </div>
<script>
  (function(){
    var q = new URLSearchParams(location.search);
    var code = q.get('code');
    var err = q.get('error_description') || q.get('error');
    var codeEl = document.getElementById('code');
    if (code) {
      code = code.replace(/#_+$/, '');
      codeEl.textContent = code;
    } else {
      document.getElementById('badge').textContent = '!';
      document.getElementById('badge').style.background = '#a1543a';
      document.getElementById('title').textContent = 'Nešto nije u redu';
      document.getElementById('lead').innerHTML = err
        ? ('Greška prilikom povezivanja: <span class="err">' + err + '</span>')
        : 'Nema koda u adresi. Otvorite link za povezivanje ponovo.';
      codeEl.style.display = 'none';
      document.getElementById('copyBtn').style.display = 'none';
    }
    var btn = document.getElementById('copyBtn');
    btn && btn.addEventListener('click', function(){
      if (!code || !navigator.clipboard) return;
      navigator.clipboard.writeText(code).then(function(){
        document.getElementById('copied').textContent = 'Kopirano ✓';
      }).catch(function(){});
    });
  })();
</script>
</body>
</html>
