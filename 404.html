<title>Preusmeravanje… — Dr Gorica Rogan Opačić</title>
<script>
  (function () {
    // Stari Wix sajt je imao zasebne stranice (/cenovnik, /o-meni…).
    // Novi sajt je jednostranični — mapiramo stare putanje na sekcije (#).
    var seg = (location.pathname || '/').replace(/^\/+|\/+$/g, '').toLowerCase().split('/').pop().replace(/\.html?$/, '');
    var map = {
      'cenovnik': 'cenovnik', 'cene': 'cenovnik', 'cenovnik': 'cenovnik', 'pricing': 'cenovnik',
      'o-meni': 'o-meni', 'o-nama': 'o-meni', 'onama': 'o-meni', 'omeni': 'o-meni', 'about': 'o-meni',
      'tretmani': 'tretmani', 'tretman': 'tretmani', 'usluge': 'tretmani', 'services': 'tretmani',
      'pitanja': 'pitanja', 'faq': 'pitanja', 'najcesca-pitanja': 'pitanja',
      'galerija': 'galerija', 'radovi': 'galerija', 'nasi-radovi': 'galerija', 'gallery': 'galerija',
      'kontakt': 'kontakt', 'contact': 'kontakt',
      'pocetna': '', 'naslovna': '', 'home': '', 'index': ''
    };
    var target = '/';
    if (Object.prototype.hasOwnProperty.call(map, seg)) {
      target = map[seg] ? '/#' + map[seg] : '/';
    }
    location.replace(target);
  })();
</script>
